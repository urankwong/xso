name: Build Android APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

# 说明：内置源不放在本公开仓，构建时从独立私有仓拉入 app/assets/sources。
# 拉取用一把「只读凭据」：公钥已加到源内容仓(只读)，私钥存于本仓
# CI 用该凭据通过 SSH 克隆源内容仓，权限最小。

# 发布 Release 需要写权限。仓库默认的 workflow 权限往往是「只读仓库内容」，
# 而该步骤平时被 if 跳过、纯 push 构建不会触发，所以权限缺失要等到第一次
# 打 tag 才暴露（表现为本步 403 Resource not accessible by integration）。
# 这里按最小必要显式声明：建 Release/传资产要 contents:write，
# generate_release_notes 生成变更说明要读提交/PR。
permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 公开代码
        uses: actions/checkout@v4
        # 注意：不要加 fetch-tags: true。checkout 会同时按 commit SHA 与 tag ref
        # 拉取，二者目标冲突会直接 git exit 128（"Cannot fetch both <sha> and
        # refs/tags/<name> to refs/tags/<name>"），导致整条流水线从第 2 步就失败。
        # 需要 tag 注释时，在后面单独精确 fetch 那一个 ref（见「读取 tag 说明」）。

      - name: 拉取内置源(只读凭据)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCES_REPO }}
          ssh-key: ${{ secrets.SOURCES_SSH_KEY }}
          ref: main
          path: app/assets/sources

      - name: 校验源已就位
        run: |
          n=$(ls app/assets/sources | wc -l)
          echo "app/assets/sources 文件数: $n"
          test "$n" -gt 100 || { echo "内置源未拉取成功"; exit 1; }

      - name: 生成内置源索引(不入库公开仓)
        # 依据实际拉取到的文件动态生成清单索引，供 builtin_sources.dart 运行时枚举；
        # 内置站点清单因此不出现在公开源码里。_index.json 随 gitignore 的
        # assets/sources 目录一起打包进 APK。
        run: |
          cd app/assets/sources
          find . -maxdepth 1 -type f ! -name '_index.json' -printf '%f\n' \
            | sort | jq -R . | jq -s '{files:.}' > _index.json
          echo "索引条数: $(jq '.files|length' _index.json)"

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 依赖拉取
        working-directory: app
        run: flutter pub get

      - name: 构建 debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: 构建 release APK(分架构)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: 上传 debug 产物
        uses: actions/upload-artifact@v4
        with:
          name: xso-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: 上传 release 产物
        uses: actions/upload-artifact@v4
        with:
          name: xso-release-split
          path: app/build/app/outputs/flutter-apk/app-arm*.apk

      - name: 读取 tag 说明作为 Release 正文
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          # annotated tag 的注释正文就是面向用户的更新说明（App 内更新弹窗直接展示）。
          # 浅克隆里没有 tag 对象，只精确拉当前这一个 ref（全量 fetch-tags 会冲突）。
          git fetch --no-tags --depth=1 origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          # 多行值必须用 heredoc 写 GITHUB_OUTPUT，直接 echo "body=$(...)" 会只留首行
          {
            echo 'body<<XSO_BODY_EOF'
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" || true
            echo 'XSO_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 打 tag 时发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 汇搜 ${{ github.ref_name }}
          # App 内「检查更新」弹窗会展示 Release 正文；正文取自 tag 注释，
          # 只有 tag 没写注释时才回退为 GitHub 自动生成的变更列表
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          # 路径写错时宁可红着，也别静默发一个没有安装包的 Release
          # （v0.1.0+7/+8 就是这么发布出「只有 source zip」的空 Release 的）
          fail_on_unmatched_files: true
          files: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
