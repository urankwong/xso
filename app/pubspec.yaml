name: app
description: 聚合搜索 App 壳
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  source_engine:
    path: ../packages/source_engine
  data:
    path: ../packages/data
  flutter_js: ^0.8.3
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.0
  gbk_codec: ^0.4.0
  just_audio: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sources/

# sqlite3 构建钩子默认从 GitHub 下载预编译库，国内不可达，
# 改走 ghfast.top 代理（本地构建配置，不影响运行时）。
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://ghfast.top/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
