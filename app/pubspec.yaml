name: app
description: 聚合搜索 App 壳
publish_to: none
version: 0.2.0+13
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  source_engine:
    path: ../packages/source_engine
  data:
    path: ../packages/data
  flutter_js: ^0.8.3
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.0
  public_file_saver: ^1.1.0
  # 打开已下载的文件：音频→系统播放器、epub/pdf→阅读器。
  # 用**本地 vendor 版本**：上游 open_filex 4.7.0 的 android/build.gradle
  # 自带 `classpath 'com.android.tools.build:gradle:8.1.0'`，与项目 AGP 9.1
  # 冲突（构建报 "'kotlin-android' plugin requires one of the Android Gradle
  # plugins"）。vendor 版只改构建配置（去掉自带 AGP + 同步 AGP 9 DSL），
  # 源码是纯 Java、未做任何修改。
  open_filex:
    path: ../packages/open_filex_local
  gbk_codec: ^0.4.0
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.17
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  pointycastle: ^3.9.1
  asn1lib: ^1.5.3
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  # 听书：Edge TTS（联网，微软神经网络语音，免费无需 key）+ 系统 TTS（离线备用）
  edge_tts: ^0.1.5
  flutter_tts: ^4.2.5
dependency_overrides:
  # objective_c 9.6.1 的 hook/build.dart 用了 Architecture.arm64e，
  # 需要更新版 native_toolchain_c 才有该成员，否则 kernel 编译失败
  # （2026-09-15 构建 "Member not found: 'arm64e'" 实测踩坑）。
  # 锁回 9.6.0（本机缓存已有，此前构建成功用的就是它）；
  # 待 native_toolchain_c 解析到带 arm64e 的版本后可移除此覆盖。
  objective_c: 9.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sources/
    - assets/js/
    - assets/web/

# sqlite3 构建钩子默认从 GitHub 下载预编译库，国内不可达，
# 改走 ghfast.top 代理（本地构建配置，不影响运行时）。
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://ghfast.top/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
